<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Talep Takip — testler</title>
<style>
  body { font: 14px/1.5 "Segoe UI", system-ui, sans-serif; margin: 24px; max-width: 900px;
         background: #efe9de; color: #2c261d; }
  h1 { font-size: 18px; }
  #ozet { padding: 10px 14px; border-radius: 8px; margin: 14px 0; font-weight: 600; }
  #ozet.gecti { background: #e7eeda; color: #3d6b34; }
  #ozet.kaldi { background: #f6e3dc; color: #a3402c; }
  #ozet.calisiyor { background: #faf6ef; color: #786c5b; }
  ol { padding-left: 22px; }
  li { margin: 3px 0; }
  li.gecti::marker { content: "✔ "; color: #3d6b34; }
  li.kaldi::marker { content: "✘ "; color: #a3402c; }
  li.kaldi { color: #a3402c; }
  pre { background: #faf6ef; padding: 8px 10px; border-radius: 6px; overflow: auto; font-size: 12px; margin: 4px 0 8px; }
</style>
</head>
<body>
<h1>Talep Takip — testler</h1>
<p>Bu dosyayı çift tıklayarak açın; testler kendiliğinden çalışır.</p>
<div id="ozet" class="calisiyor">Çalışıyor…</div>
<ol id="liste"></ol>

<script src="js/kutuphane/pdf.js"></script>
<script src="js/kutuphane/pdf-worker.b64.js"></script>
<script src="js/kutuphane/pdf-fontlar.b64.js"></script>
<script src="js/kutuphane/sql-wasm.js"></script>
<script src="js/kutuphane/sql-wasm.b64.js"></script>
<script src="js/ayristir.js"></script>
<script src="js/pdf-metin.js"></script>
<script src="js/veritabani.js"></script>
<script src="test/ornek.b64.js"></script>
<script src="test/ornek2.b64.js"></script>
<script src="test/ornek3.b64.js"></script>

<script>
'use strict';

const sonuclar = [];

function esit(bulunan, beklenen, ad) {
  const a = JSON.stringify(bulunan);
  const b = JSON.stringify(beklenen);
  sonuclar.push({ ad, gecti: a === b, ayrinti: a === b ? '' : `bulunan: ${a}\nbeklenen: ${b}` });
}
function dogru(kosul, ad, ayrinti = '') {
  sonuclar.push({ ad, gecti: Boolean(kosul), ayrinti: kosul ? '' : ayrinti });
}

const kelime = (metin, x0, x1, y, h = 9) => ({ metin, x0, x1, y, h });
const A = () => TT.ayristirici;

// ——— testler ———

function sadeTesti() {
  esit(A().sade('İŞLENMİŞ DEMİR'), 'islenmis demir', 'sade(): Türkçe harfler karşılaştırılabilir hâle gelir');
  esit(A().sade('  Malzeme   Kodu '), 'malzeme kodu', 'sade(): fazla boşluklar temizlenir');
  esit(A().sade('Üretim Yeri'), 'uretim yeri', 'sade(): Ü → u');
}

function miktarTesti() {
  const m = A().miktariSayiyaCevir;
  esit(m('55,820'), 55.82, 'miktar: "55,820" → 55.82 (Türkçe ondalık)');
  esit(m('1.234'), 1234, 'miktar: "1.234" → 1234 (binlik ayracı)');
  esit(m('55.82'), 55.82, 'miktar: "55.82" → 55.82 (ondalık nokta)');
  esit(m('1.234.567,89'), 1234567.89, 'miktar: "1.234.567,89" → 1234567.89');
  esit(m('1,234,567.89'), 1234567.89, 'miktar: "1,234,567.89" → 1234567.89');
  esit(m(''), null, 'miktar: boş → null');
  esit(m('abc'), null, 'miktar: harf → null');
}

function satirTesti() {
  // 18 pt aralıkla üç satır; her satırın kendi içinde 2,5 pt oynama var.
  const kelimeler = [];
  for (let s = 0; s < 3; s++) {
    for (let k = 0; k < 6; k++) {
      kelimeler.push(kelime(`s${s}k${k}`, k * 60, k * 60 + 40, 100 + s * 18 + (k % 2 ? 2.5 : 0)));
    }
  }
  const satirlar = A().satirlar(kelimeler);
  esit(satirlar.length, 3, 'satırlar: satır içi oynama satırları birleştirmez');
  esit(satirlar.map((s) => s.kelimeler.length), [6, 6, 6], 'satırlar: her satırda 6 kelime');
}

function hucreOnarimTesti() {
  // "B50" açıklama ile miktar kolonunun tam sınırında duruyor.
  const kelimeler = [
    kelime('No', 26, 37, 100),
    kelime('Malzeme', 483, 520, 100), kelime('Kodu', 521, 543, 100),
    kelime('SAP', 584, 600, 100), kelime('Malzeme', 602, 638, 100), kelime('Tanımı', 640, 667, 100),
    kelime('Miktar', 704, 727, 100),
    kelime('Birim', 745, 767, 100),
    kelime('00001', 21, 43, 120),
    kelime('4600032199', 471, 515, 120),
    kelime('Ø20', 661, 676, 120),
    kelime('B50', 678, 692, 120), // merkezi 685 → miktar kolonuna düşer, geri alınmalı
    kelime('55,820', 696, 720, 120),
    kelime('KG', 741, 752, 120),
  ];
  const { kalemler } = A().ayristir([{ no: 1, genislik: 792, yukseklik: 612, kelimeler }]);
  esit(kalemler.length, 1, 'onarım: tek kalem okunur');
  esit(kalemler[0].miktar, '55,820', 'onarım: miktar doğru hücrede');
  esit(kalemler[0].aciklama, 'Ø20 B50', 'onarım: sınıra oturan "B50" açıklamaya geri döner');
  esit(kalemler[0].birim, 'KG', 'onarım: birim doğru');
  esit(kalemler[0].kod, '4600032199', 'onarım: malzeme kodu doğru');
}

function yapisikBirimTesti() {
  const kelimeler = [
    kelime('No', 26, 37, 100),
    kelime('Malzeme', 483, 520, 100), kelime('Kodu', 521, 543, 100),
    kelime('Miktar', 704, 727, 100),
    kelime('00007', 21, 43, 120),
    kelime('4600032199', 471, 515, 120),
    kelime('12,5KG', 696, 730, 120),
  ];
  const { kalemler } = A().ayristir([{ no: 1, genislik: 792, yukseklik: 612, kelimeler }]);
  esit(kalemler[0].miktar, '12,5', 'yapışık birim: "12,5KG" → miktar 12,5');
  esit(kalemler[0].birim, 'KG', 'yapışık birim: "12,5KG" → birim KG');
}

async function ornekFormTesti() {
  const bayt = TT.pdf.b64Ikili(window.ORNEK_PDF_B64);
  const { kaynak, sayfalar } = await TT.pdf.pdfOku(bayt);
  esit(kaynak, 'metin', 'örnek form: metin katmanından okunur, OCR gerekmez');

  const { baslik, kalemler, uyarilar } = A().ayristir(sayfalar);
  esit(baslik.talepNo, '0022866', 'örnek form: talep no');
  esit(baslik.depoTanimi, '8 NOLU AMBAR', 'örnek form: depo tanımı');
  esit(baslik.nereden, '8 NOLU AMBAR (1024)', 'örnek form: nereden');
  esit(baslik.kullanici, 'MKEFELIOGLU', 'örnek form: talep eden kullanıcı');
  esit(baslik.birim, 'Reaktör-4 IC Nük', 'örnek form: talep eden birim');
  esit(uyarilar, [], 'örnek form: uyarı çıkmaz');
  esit(kalemler.length, 13, 'örnek form: 13 kalem');
  esit(kalemler[0], {
    sayfa: 1, sira: 1, metin: 'İŞLENMİŞ DEMİR', proje: 'AKU.0179.40UJA.0.KZ.TB0016',
    poz: '34', kod: '4600032199', aciklama: '0179.40UJA.0.KZ.TB0016 / Ø20 B50',
    miktar: '55,820', birim: 'KG', notlar: '', miktarSayi: 55.82,
  }, 'örnek form: ilk kalem birebir');
  esit(kalemler[0].kod, '4600032199',
    'örnek form: gerçek malzeme kodu poz ile birleştirilmez');
  esit(baslik.kullanici, 'MKEFELIOGLU', 'örnek form: formdaki kullanıcı korunur');
  esit(kalemler[12].miktar, '57,110', 'örnek form: son kalemin miktarı');
  esit(kalemler[12].poz, '1', 'örnek form: son kalemin pozu');
  dogru(kalemler.every((k) => k.kod === '4600032199' && k.birim === 'KG' && k.miktarSayi > 0),
    'örnek form: tüm kalemlerde kod, birim ve miktar dolu');
  return { baslik, kalemler };
}

async function ikinciFormTesti() {
  // İngilizce başlıklı, 13 kolonlu, başlığı iki satıra taşan form.
  const bayt = TT.pdf.b64Ikili(window.ORNEK2_PDF_B64);
  const { kaynak, sayfalar } = await TT.pdf.pdfOku(bayt);
  esit(kaynak, 'metin', 'ikinci form: metin katmanından okunur');

  const { baslik, kalemler, uyarilar } = A().ayristir(sayfalar);
  esit(baslik.talepNo, '0028782', 'ikinci form: talep no ("Request form no:")');
  esit(baslik.depoTanimi, 'ICE YEŞİLOVACIK', 'ikinci form: depo ("Warehouse Desc. :")');
  esit(baslik.depoYeri, '4003', 'ikinci form: depo yeri ("Warehouse :")');
  esit(baslik.nereden, 'ICE YEŞİLOVACIK (4003)', 'ikinci form: nereden');
  esit(baslik.tarihSaat, '03.09.2026', 'ikinci form: tarih');
  esit(baslik.kullanici, 'Reaktör 4 T.O.', 'ikinci form: kullanıcı alanı yok, sabit yazılır');
  dogru(
    uyarilar.some((u) => u.includes('Order No')),
    'ikinci form: malzeme kodu kolonu olmadığı söylenir'
  );
  esit(kalemler.length, 1, 'ikinci form: 1 kalem');
  esit(kalemler[0], {
    sayfa: 1, sira: 10, metin: 'GÖMÜLÜ MALZEME', proje: 'AKU.0120.40UJA.0.KZ.LC0174',
    poz: 'TA319-8', kod: 'EM-00689.23-TA319-8', aciklama: 'GÖMÜLÜ MALZEME',
    miktar: '1', birim: 'ADT', notlar: '', miktarSayi: 1,
  }, 'ikinci form: kalem birebir (Material Description → metin, Order No + poz → kod)');
}

async function ucuncuFormTesti() {
  // Depo satırları olmayan İngilizce form; üç kalemde de sipariş no aynı.
  const bayt = TT.pdf.b64Ikili(window.ORNEK3_PDF_B64);
  const { sayfalar } = await TT.pdf.pdfOku(bayt);
  const { baslik, kalemler } = A().ayristir(sayfalar);

  esit(baslik.talepNo, '0017206', 'üçüncü form: talep no');
  esit(baslik.tarihSaat, '13.03.2026', 'üçüncü form: tarih');
  esit(baslik.depoTanimi, '', 'üçüncü form: depo tanımı yok');
  esit(baslik.depoYeri, '', 'üçüncü form: depo yeri yok');
  esit(baslik.nereden, 'Endüstriyel', 'üçüncü form: depo yoksa nereden = Endüstriyel');
  esit(baslik.kullanici, 'Reaktör 4 T.O.', 'üçüncü form: kullanıcı sabiti');

  esit(kalemler.length, 3, 'üçüncü form: 3 kalem');
  esit(kalemler.map((k) => k.poz), ['TA5', 'TA2', 'TA4'],
    'üçüncü form: poz kolonu projeye karışmaz (başlığın solunda duruyor)');
  esit(kalemler.map((k) => k.kod), ['EM-01316-TA5', 'EM-01316-TA2', 'EM-01316-TA4'],
    'üçüncü form: aynı sipariş no poz ile ayrışır');
  esit(kalemler.map((k) => k.miktar), ['2', '3', '2'], 'üçüncü form: miktarlar');
  dogru(kalemler.every((k) => k.proje === 'AKU.0120.00USY.0.KZ.LC0019' && k.birim === 'ADT'),
    'üçüncü form: proje ve birim tüm satırlarda doğru');
  dogru(kalemler.every((k) => k.aciklama === 'GÖMÜLÜ ELEMAN' && k.metin === 'GÖMÜLÜ ELEMAN'),
    'üçüncü form: açıklama malzeme metninden doldurulur');
}

function baslikBloguTesti() {
  // "Thickness / (mm)" gibi iki satıra taşan etiketler tek başlık sayılmalı.
  const k = kelime;
  const kelimeler = [
    k('Thickness', 141, 178, 100, 7), k('Quality/', 185, 216, 100, 7),
    k('No', 27, 38, 105, 7), k('Material', 53, 84, 105, 7), k('Description', 88, 130, 105, 7),
    k('Quantity', 551, 584, 105, 7), k('Unit', 593, 609, 105, 7),
    k('(mm)', 149, 170, 110, 7), k('Class', 191, 210, 110, 7),
    // veri satırı
    k('000010', 21, 42, 126, 7), k('GÖMÜLÜ', 49, 74, 126, 7),
    k('8', 155, 160, 126, 7), k('S355', 190, 210, 126, 7),
    k('1', 550, 554, 126, 7), k('ADT', 590, 602, 126, 7),
  ];
  const { kalemler } = A().ayristir([{ no: 1, genislik: 792, yukseklik: 612, kelimeler }]);
  esit(kalemler.length, 1, 'başlık bloğu: veri satırı başlığa karışmaz');
  esit(kalemler[0].aciklama, 'GÖMÜLÜ', 'başlık bloğu: açıklama kolonu doğru');
  esit(kalemler[0].miktar, '1', 'başlık bloğu: miktar doğru');
  esit(kalemler[0].notlar, 'Kalınlık: 8 · Kalite: S355',
    'başlık bloğu: taşan başlıklı ek kolonlar nota toplanır');
}

async function veritabaniTesti({ baslik, kalemler }) {
  const db = await TT.Veritabani.ac();
  const { talepId, kalemSayisi } = db.talepEkle({
    baslik, kalemler,
    pdf: { dosya: 'x.pdf', ozet: 'ozet1', ad: 'x.pdf', kaynak: 'metin', sayfaSayisi: 1 },
  });
  esit(kalemSayisi, 13, 'veritabanı: 13 kalem yazılır');
  esit(db.ozet(), { kalem: 13, onay: 0, red: 0, bekleyen: 13, talep: 1 }, 'veritabanı: özet doğru');

  for (const q of ['demir', 'DEMİR', 'İşlenmiş', 'tb0016', 'demir 4600']) {
    esit(db.kalemler({ arama: q }).length, 13, `arama: "${q}" 13 kalem bulur`);
  }
  esit(db.kalemler({ arama: 'bakır' }).length, 0, 'arama: "bakır" hiçbir şey bulmaz');

  // Ek kolonlardan gelen not veritabanına geçiyor ve aranabiliyor mu?
  db.talepEkle({
    baslik: { talepNo: 'NOT-1', nereden: 'Endüstriyel' },
    kalemler: [{ sira: 1, kod: 'K1', aciklama: 'A', metin: 'M', miktar: '1', birim: 'AD',
                 notlar: 'Kalınlık: 8 · Kalite: S355' }],
    pdf: { ozet: 'ozet2', ad: 'y.pdf', kaynak: 'metin', sayfaSayisi: 1 },
  });
  const notluKalem = db.kalemler({ talepNo: 'NOT-1' })[0];
  esit(notluKalem.notlar, 'Kalınlık: 8 · Kalite: S355', 'not: ek kolonlar veritabanına yazılır');
  esit(notluKalem.nereden, 'Endüstriyel', 'not: nereden başlıktan devralınır');
  esit(db.kalemler({ arama: 'S355' }).length, 1, 'not: ek kolon içeriği aranabilir');
  db.talepSil(notluKalem.talep_id);

  dogru(db.pdfVarMi('ozet1'), 'kopya: aynı PDF özeti tanınır');
  esit(db.pdfVarMi('baska'), null, 'kopya: farklı özet tanınmaz');

  const ilk = db.kalemler()[0];
  db.kalemDurumu(ilk.id, 'onay');
  esit(db.ozet().onay, 1, 'durum: tek kalem onaylanır');
  esit(db.kalemler({ durum: 'bekleyen' }).length, 12, 'durum: bekleyen sayısı düşer');
  dogru(db.kalem(ilk.id).durum_tarihi, 'durum: tarih damgası konur');

  db.kalemDurumu(ilk.id, 'red');
  esit(db.ozet(), { kalem: 13, onay: 0, red: 1, bekleyen: 12, talep: 1 }, 'durum: onaydan redde geçer');
  esit(db.kalemler({ durum: 'red' }).length, 1, 'durum: red filtresi');
  esit(db.kalemler({ durum: 'onay' }).length, 0, 'durum: onay filtresi');

  db.kalemDurumu(ilk.id, 'bekliyor');
  esit(db.ozet().bekleyen, 13, 'durum: bekliyora geri döner');
  esit(db.kalem(ilk.id).durum_tarihi, null, 'durum: bekliyorda tarih damgası silinir');

  db.talepDurumu(talepId, 'onay');
  esit(db.ozet().onay, 13, 'durum: talebin tamamı onaylanır');
  db.talepDurumu(talepId, 'red');
  esit(db.ozet().red, 13, 'durum: talebin tamamı reddedilir');
  db.talepDurumu(talepId, 'bekliyor');
  esit(db.ozet().bekleyen, 13, 'durum: talep geri alınabilir');

  let gecersizYakalandi = false;
  try { db.kalemDurumu(ilk.id, 'sacma'); } catch { gecersizYakalandi = true; }
  dogru(gecersizYakalandi, 'durum: tanınmayan durum reddedilir');

  db.kalemDuzenle(ilk.id, { aciklama: 'PASLANMAZ BORU' });
  esit(db.kalemler({ arama: 'paslanmaz' }).length, 1, 'düzenleme: arama dizinine yansır');
  db.kalemDuzenle(ilk.id, { durum: 'onay', talep_id: 999 });
  esit(db.kalem(ilk.id).durum, 'bekliyor', 'düzenleme: beyaz listede olmayan alan yazılmaz');
  esit(db.kalem(ilk.id).talep_id, talepId, 'düzenleme: talep_id değiştirilemez');

  // Dosyaya yazıp geri okuma — gerçek SQLite dosyası mı?
  const dosya = db.disaAktar();
  esit(new TextDecoder().decode(dosya.slice(0, 15)), 'SQLite format 3', 'dışa aktarma: gerçek SQLite dosyası');
  const db2 = await TT.Veritabani.ac(dosya);
  esit(db2.ozet().kalem, 13, 'dışa aktarma: geri okunduğunda kalemler yerinde');
  db2.kapat();

  db.talepSil(talepId);
  esit(db.ozet(), { kalem: 0, onay: 0, red: 0, bekleyen: 0, talep: 0 }, 'silme: talep ve kalemleri gider');
  db.kapat();
}

// ——— çalıştır ———

(async () => {
  try {
    sadeTesti();
    miktarTesti();
    satirTesti();
    hucreOnarimTesti();
    yapisikBirimTesti();
    const cozum = await ornekFormTesti();
    await ikinciFormTesti();
    await ucuncuFormTesti();
    baslikBloguTesti();
    await veritabaniTesti(cozum);
  } catch (e) {
    sonuclar.push({ ad: 'beklenmeyen hata', gecti: false, ayrinti: String(e && e.stack || e) });
  }

  const liste = document.getElementById('liste');
  liste.innerHTML = sonuclar
    .map((s) => `<li class="${s.gecti ? 'gecti' : 'kaldi'}">${s.ad}${s.ayrinti ? `<pre>${s.ayrinti.replace(/[<&]/g, (c) => (c === '<' ? '&lt;' : '&amp;'))}</pre>` : ''}</li>`)
    .join('');

  const kalan = sonuclar.filter((s) => !s.gecti).length;
  const ozet = document.getElementById('ozet');
  ozet.className = kalan ? 'kaldi' : 'gecti';
  ozet.textContent = kalan
    ? `${sonuclar.length} testten ${kalan} tanesi başarısız.`
    : `${sonuclar.length} testin hepsi geçti.`;

  window.TEST_SONUC = { toplam: sonuclar.length, kalan, kalanlar: sonuclar.filter((s) => !s.gecti) };
})();
</script>
</body>
</html>
